name: Verify procurement policy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check procurement-policy.js
      - name: Run policy and integration tests
        run: node --test tests/*.test.js
